name: Daily Horizon Summary

on:
  schedule:
    # GitHub 的 cron 一律按 UTC 解释。
    # 00:45 UTC = 08:45 北京时间（Asia/Shanghai, UTC+8），全年不变，不受夏令时影响。
    - cron: '45 0 * * *'
  workflow_dispatch:      # 允许在网页上手动触发

# 同一时间只跑一个，避免上一次没跑完又叠一次
concurrency:
  group: daily-summary
  cancel-in-progress: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 提交产物、推 gh-pages 都需要

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      # 关键：Secret 不存在时 GitHub 会注入"空字符串"，而不是不注入。
      # Horizon 的 WebhookNotifier 看到变量存在但为空会直接抛 ValueError 让整个任务挂掉，
      # 所以这里先判断非空，才写进环境变量。
      - name: Export optional secrets
        run: |
          if [ -n "${WEBHOOK_URL:-}" ]; then
            echo "HORIZON_WEBHOOK_URL=${WEBHOOK_URL}" >> $GITHUB_ENV
            echo "已注入飞书 Webhook 地址"
          else
            echo "未配置 HORIZON_WEBHOOK_URL，本次不推送"
          fi
          if [ -n "${LWN:-}" ]; then
            echo "LWN_KEY=${LWN}" >> $GITHUB_ENV
          fi
        env:
          WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          LWN: ${{ secrets.LWN_KEY }}

      - name: Run Horizon
        env:
          # 这个变量名必须和 data/config.github.json 里 ai.api_key_env 的值完全一致
          TOKENPLUS_API_KEY: ${{ secrets.TOKENPLUS_API_KEY }}
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        if: always()
        run: echo "DATE=$(TZ=Asia/Shanghai date +'%Y-%m-%d')" >> $GITHUB_ENV

      # 保活：每天产生一次提交，让仓库保持"有活动"，
      # 否则公开仓库 60 天无提交会被 GitHub 自动停掉定时任务。
      # 即使上面的 Horizon 跑挂了也要执行，所以写 if: always()。
      - name: Commit summaries back (keepalive)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 这两个路径被 .gitignore 忽略，必须用 -f 强制加入
          git add -f data/summaries docs/_posts || true
          if git diff --cached --quiet; then
            echo "今天没有新文件，提交一个空提交做保活"
            git commit --allow-empty -m "chore(keepalive): ${DATE}"
          else
            git commit -m "docs(summary): ${DATE}"
          fi
          git push origin HEAD:main

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # 保留历史日报
          commit_message: "Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
