name: Daily Horizon Summary

on:
  schedule:
    # GitHub 的 cron 一律按 UTC 解释。
    # 00:45 UTC = 08:45 北京时间（Asia/Shanghai, UTC+8），全年不变，不受夏令时影响。
    - cron: '45 0 * * *'
  workflow_dispatch:      # 允许手动触发

# 同一时间只跑一个，避免上一次没跑完又叠一次
concurrency:
  group: daily-summary
  cancel-in-progress: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 需要提交产物、推 gh-pages
      actions: write      # 保活步骤需要重新启用 workflow 的权限

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          # 这里的环境变量名必须和 data/config.github.json 里 ai.api_key_env 写的名字一致
          TOKENPLUS_API_KEY: ${{ secrets.TOKENPLUS_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        run: echo "DATE=$(TZ=Asia/Shanghai date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Commit summaries back (keep repository active)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 这两个路径被 .gitignore 忽略，必须 -f 强制加入
          git add -f data/summaries docs/_posts || true
          if git diff --cached --quiet; then
            echo "今天没有新文件，提交一个空提交做保活"
            git commit --allow-empty -m "chore(keepalive): ${DATE}"
          else
            git commit -m "docs(summary): ${DATE}"
          fi
          git push origin HEAD:main

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # 保留历史日报
          commit_message: "Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

      - name: Keepalive workflow
        if: always()
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          time_elapsed: '45'
